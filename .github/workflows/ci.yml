name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  proto-contract:
    name: Protobuf Contract & Zero Stub Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: bufbuild/buf-setup-action@v1

      - name: Install protoc and Go protobuf plugins
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2

      - name: Verify Protobuf lint, FileDescriptorSet, Go stubs, and TS wire types zero drift
        run: |
          CGO_ENABLED=0 go run ./cmd/marlin-mygo-tool descriptor
          CGO_ENABLED=0 go run ./cmd/marlin-mygo-tool gen
          CGO_ENABLED=0 go run ./cmd/marlin-mygo-tool gen-ts
          git diff --exit-code -- gen/ packages/panel-sdk/src/generated/

  formal-security-quint:
    name: Quint Formal Adversarial Security Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Quint formal model checker
        run: npm install -g @informalsystems/quint

      - name: Run Pure-Go Quint model-gate (safe + 7 adversarial negative controls, offline TS backend)
        run: CGO_ENABLED=0 go run ./cmd/marlin-mygo-tool model-gate -backend=typescript -samples=500

  go-engine-race-and-fuzz:
    name: Go Engine Tests, Race, Fuzz & Zero-CGO Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Pure-Go zero-cgo unit, property, and resident WASM tests
        run: CGO_ENABLED=0 go test -v ./pkg/... ./engine/... ./runtime/... ./control/... ./sdk/... ./cmd/...

      - name: Run Go race detector on concurrent engine & security planes
        run: go test -race ./pkg/... ./engine/... ./control/... ./runtime/pluginhost ./runtime/device

      - name: Run native Go fuzz smoke tests on protocol, schema, drawlist, arena & input boundaries
        run: |
          CGO_ENABLED=0 go test -fuzz=FuzzValidateDotIdentifier -fuzztime=3s ./pkg/schema
          CGO_ENABLED=0 go test -fuzz=FuzzParseSubmissionID -fuzztime=3s ./pkg/schema
          CGO_ENABLED=0 go test -fuzz=FuzzDecodeDrawList -fuzztime=3s ./pkg/schema
          CGO_ENABLED=0 go test -fuzz=FuzzArenaCompileAndDiff -fuzztime=3s ./engine/arena
          CGO_ENABLED=0 go test -fuzz=FuzzFuzzyScore -fuzztime=3s ./engine/input
          CGO_ENABLED=0 go test -fuzz=FuzzWebViewProtocolHTTP -fuzztime=3s ./runtime/pluginhost
          CGO_ENABLED=0 go test -fuzz=FuzzDecodeAndAdmitWasmUITree -fuzztime=3s ./runtime/pluginhost

      - name: Run static analysis & verify zero-cgo desktop binary build
        run: |
          CGO_ENABLED=0 go vet ./...
          CGO_ENABLED=0 go build ./cmd/marlin-app

  ts-sdk-and-bench:
    name: TypeScript Panel SDK & Engine Benchmark Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@v2

      - name: Run TypeScript Panel SDK unit tests
        run: bun test packages/panel-sdk

      - name: Run Go + TypeScript Frontend Engine benchmark smoke gate
        run: |
          CGO_ENABLED=0 go test -bench=. -benchmem -benchtime=200ms ./bench/...
          bun bench/ts/panel_bench.ts

  reuse-spdx:
    name: REUSE SPDX License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5
