version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  ignore_only:
    # app_server.proto preserves upstream marlin-agent-core service & stream names byte-for-byte.
    SERVICE_SUFFIX:
      - proto/marlin/app/v1/app_server.proto
    RPC_RESPONSE_STANDARD_NAME:
      - proto/marlin/app/v1/app_server.proto
breaking:
  use:
    - FILE
