# Reference Target Profile Overlay manifest: iOS Personal Agent (App Store safe declarative pack)
id = "tao3k.ios-personal-capture"
version = "0.2.0"
contract_major = 1
requires_features = ["workflow-preset", "device-profile"]

[capabilities.ios_screenshot_intent]
kind = "device.capability"
target = "mobile-ios"
protocol = "device.ios.share.drain"

[capabilities.ios_photos_recent]
kind = "device.capability"
target = "mobile-ios"
protocol = "device.ios.photos.recent"
optional = true

[capabilities.ios_voice_capture]
kind = "device.capability"
target = "mobile-ios"
protocol = "device.ios.voice.transcribe"
optional = true

[contributions.personal_capture_overlay]
kind = "workflow-preset"
policy_module = "marlin.personal.capture-ios"
settings_schema = "marlin.personal.capture.settings.v1"
requires = ["ios_screenshot_intent", "ios_photos_recent", "ios_voice_capture"]

[contributions.personal_theme]
kind = "ui-panel"

[contributions.personal_theme.panel]
runtime = "declarative"
slot_id = "workbench.main"
cardinality = "single"
entry_path = "overlay.toml"
read_scopes = ["session.summary"]
declared_actions = ["capture.triage"]
