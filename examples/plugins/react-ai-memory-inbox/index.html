<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'none'"
    />
    <title>Marlin AI Memory &amp; Knowledge Triage Inbox</title>
    <style>
      :root {
        --bg: var(--marlin-canvas, #0f1117);
        --surface: var(--marlin-bar, #161a23);
        --surface-2: #1c212e;
        --recessed: #11141c;
        --fg: var(--marlin-ink, #ebeff7);
        --muted: var(--marlin-muted, #8b94a6);
        --accent: var(--marlin-accent, #7c6af7);
        --info: var(--marlin-info, #60a5fa);
        --ok: var(--marlin-success, #4ade80);
        --warn: var(--marlin-warning, #fbbf24);
        --border: rgba(255, 255, 255, 0.08);
        --border-strong: rgba(255, 255, 255, 0.14);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 20px 24px;
        font: 13px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        background: radial-gradient(1200px 500px at 85% -10%, rgba(96, 165, 250, 0.08), transparent 60%), var(--bg);
        color: var(--fg);
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 18px;
      }
      header strong {
        display: block;
        font-size: 18px;
        font-weight: 650;
        letter-spacing: -0.02em;
        color: #f6f8fc;
      }
      .subtitle { color: var(--muted); font-size: 12px; }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin-bottom: 16px;
      }
      @media (max-width: 680px) {
        body { padding: 14px; }
        .stats { grid-template-columns: repeat(2, 1fr); }
      }
      .stat {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 14px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }
      .stat strong {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: #ffffff;
        display: block;
      }
      .controls {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 16px;
      }
      .controls input {
        flex: 1;
        min-width: 200px;
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--recessed);
        color: var(--fg);
        font: inherit;
        outline: none;
      }
      .controls input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(124, 106, 247, 0.2);
      }
      button {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px 12px;
        font: inherit;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        background: var(--surface-2);
        color: var(--fg);
        transition: background 140ms ease, border-color 140ms ease;
      }
      button:hover { background: #252b3b; border-color: var(--border-strong); }
      button.active {
        background: var(--accent);
        border-color: rgba(255, 255, 255, 0.14);
        color: #ffffff;
        font-weight: 600;
      }
      button.accept {
        background: rgba(74, 222, 128, 0.14);
        border-color: rgba(74, 222, 128, 0.28);
        color: #6ee7a0;
        font-weight: 600;
      }
      button.accept:hover { background: rgba(74, 222, 128, 0.22); }
      button.supersede {
        background: rgba(251, 191, 36, 0.12);
        border-color: rgba(251, 191, 36, 0.28);
        color: var(--warn);
        font-weight: 600;
      }
      button.supersede:hover { background: rgba(251, 191, 36, 0.2); }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-left: 3px solid var(--info);
        border-radius: 12px;
        padding: 14px 16px;
        margin-bottom: 10px;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }
      .card.action { border-left-color: var(--accent); }
      .card.suppressed { border-left-color: var(--warn); opacity: 0.85; }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 10.5px;
        font-weight: 600;
        margin-right: 8px;
        background: rgba(124, 106, 247, 0.15);
        border: 1px solid rgba(124, 106, 247, 0.28);
        color: #b4a7ff;
      }
      .evidence {
        font-size: 12px;
        color: #b9c2d3;
        margin: 6px 0;
        padding: 6px 10px;
        border-radius: 6px;
        background: var(--recessed);
        border-left: 2px solid var(--info);
      }
      .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
      .receipt {
        font-size: 11.5px;
        color: var(--ok);
        margin-top: 10px;
        padding: 8px 11px;
        border-radius: 8px;
        background: rgba(74, 222, 128, 0.08);
        border: 1px solid rgba(74, 222, 128, 0.18);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
