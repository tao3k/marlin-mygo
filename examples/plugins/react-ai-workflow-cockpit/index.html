<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'none'"
    />
    <title>Marlin Multi-Agent AI Workflow Cockpit</title>
    <style>
      :root {
        --bg: var(--marlin-canvas, #0f1117);
        --surface: var(--marlin-bar, #161a23);
        --surface-2: #1c212e;
        --recessed: #11141c;
        --fg: var(--marlin-ink, #ebeff7);
        --muted: var(--marlin-muted, #8b94a6);
        --accent: var(--marlin-accent, #7c6af7);
        --info: var(--marlin-info, #60a5fa);
        --ok: var(--marlin-success, #4ade80);
        --warn: var(--marlin-warning, #fbbf24);
        --danger: #f87171;
        --border: rgba(255, 255, 255, 0.08);
        --border-strong: rgba(255, 255, 255, 0.14);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 20px 24px;
        font: 13px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        background: radial-gradient(1200px 500px at 85% -10%, rgba(124, 106, 247, 0.09), transparent 60%), var(--bg);
        color: var(--fg);
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 16px;
      }
      header strong {
        display: block;
        font-size: 18px;
        font-weight: 650;
        letter-spacing: -0.02em;
        color: #f6f8fc;
      }
      .subtitle { color: var(--muted); font-size: 12px; }
      .presets { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin-bottom: 16px;
      }
      @media (max-width: 680px) {
        body { padding: 14px; }
        .stats { grid-template-columns: repeat(2, 1fr); }
      }
      .stat {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 14px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }
      .stat strong {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: #ffffff;
        display: block;
        font-variant-numeric: tabular-nums;
      }
      button {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px 12px;
        font: inherit;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        background: var(--surface-2);
        color: var(--fg);
        transition: background 140ms ease, border-color 140ms ease;
      }
      button:hover:not(:disabled) { background: #252b3b; border-color: var(--border-strong); }
      button.primary {
        background: var(--accent);
        border-color: rgba(255, 255, 255, 0.14);
        color: #ffffff;
        font-weight: 600;
        box-shadow: 0 2px 10px rgba(124, 106, 247, 0.3);
      }
      button.warn {
        background: rgba(251, 191, 36, 0.12);
        border-color: rgba(251, 191, 36, 0.3);
        color: var(--warn);
        font-weight: 600;
      }
      button.warn:hover:not(:disabled) { background: rgba(251, 191, 36, 0.22); }
      button.active {
        background: var(--accent);
        border-color: rgba(255, 255, 255, 0.14);
        color: #ffffff;
        font-weight: 600;
      }
      .step {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-left: 3px solid var(--info);
        border-radius: 10px;
        padding: 12px 14px;
        margin-bottom: 8px;
        box-shadow: 0 3px 14px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }
      .step.done { border-left-color: var(--ok); }
      .step.waiting_gate {
        border-left-color: var(--warn);
        background: linear-gradient(90deg, rgba(251, 191, 36, 0.07), var(--surface) 40%);
      }
      .step.failed { border-left-color: var(--danger); }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 10.5px;
        font-weight: 600;
        margin-right: 8px;
        background: rgba(96, 165, 250, 0.13);
        border: 1px solid rgba(96, 165, 250, 0.24);
        color: var(--info);
      }
      .receipt {
        font-size: 11.5px;
        color: var(--ok);
        margin-top: 10px;
        padding: 8px 11px;
        border-radius: 8px;
        background: rgba(74, 222, 128, 0.08);
        border: 1px solid rgba(74, 222, 128, 0.18);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
