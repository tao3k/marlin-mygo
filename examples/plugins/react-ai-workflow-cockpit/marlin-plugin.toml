# AI Workflow Use Case (React 19 TSX):
# Multi-Agent Workflow Run & Receipt Cockpit (Discover -> Plan -> Patch -> Verify)
# with per-step receipts, latency/token metrics, retry/cancel, and Tier-0 gate handoff.
id = "tao3k.ai-workflow-cockpit"
version = "0.1.0"
contract_major = 1
requires_features = ["ui-slot-v1", "scoped-panel-v1"]

[capabilities.read_workflow]
kind = "projection.read"
surface = "workflow.run"

[capabilities.read_session]
kind = "projection.read"
surface = "session.summary"

[contributions.workflow_cockpit_panel]
kind = "ui-panel"
requires = ["read_workflow", "read_session"]

[contributions.workflow_cockpit_panel.panel]
runtime = "webview-untrusted"
slot_id = "workbench.main"
cardinality = "single"
entry_path = "index.html"
read_scopes = ["workflow.run", "session.summary"]
declared_actions = [
  "workflow.run.start",
  "workflow.step.retry",
  "workflow.run.cancel",
  "workflow.gate.focus",
]
activation = "on-topic"
triggers = ["workflow.run"]
idle_unload_sec = 600
