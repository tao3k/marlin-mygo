# Developer Tools Flagship Plugin (React 19 TSX):
# Git Workbench — branch telemetry, staged/unstaged hunk triage, and action-gated commits.
id = "tao3k.git-workbench"
version = "0.1.0"
contract_major = 1
requires_features = ["ui-slot-v1", "scoped-panel-v1"]

[capabilities.read_git_status]
kind = "projection.read"
surface = "git.status"

[capabilities.read_session]
kind = "projection.read"
surface = "session.summary"

[contributions.git_workbench_panel]
kind = "ui-panel"
requires = ["read_git_status", "read_session"]

[contributions.git_workbench_panel.panel]
runtime = "webview-untrusted"
slot_id = "workbench.main"
cardinality = "single"
entry_path = "index.html"
read_scopes = ["git.status", "session.summary"]
declared_actions = [
  "git.repo.connect",
  "git.file.stage",
  "git.file.unstage",
  "git.commit.create",
  "git.branch.checkout",
]
activation = "on-topic"
triggers = ["git.status"]
idle_unload_sec = 600
