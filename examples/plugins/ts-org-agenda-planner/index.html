<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'none'"
    />
    <title>Marlin Org Agenda &amp; AI Daily Planner</title>
    <style>
      :root {
        --bg: var(--marlin-canvas, #0f1117);
        --surface: var(--marlin-bar, #161a23);
        --surface-2: #1c212e;
        --recessed: #11141c;
        --fg: var(--marlin-ink, #ebeff7);
        --muted: var(--marlin-muted, #8b94a6);
        --accent: var(--marlin-accent, #7c6af7);
        --accent-soft: rgba(124, 106, 247, 0.14);
        --info: var(--marlin-info, #60a5fa);
        --ok: var(--marlin-success, #4ade80);
        --warn: var(--marlin-warning, #fbbf24);
        --border: rgba(255, 255, 255, 0.08);
        --border-strong: rgba(255, 255, 255, 0.14);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 20px 24px;
        font: 13px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        background: radial-gradient(1200px 500px at 85% -10%, rgba(124, 106, 247, 0.09), transparent 60%), var(--bg);
        color: var(--fg);
      }
      header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 18px;
      }
      header strong {
        display: block;
        font-size: 18px;
        font-weight: 650;
        letter-spacing: -0.02em;
        color: #f6f8fc;
      }
      .subtitle { color: var(--muted); font-size: 12px; }
      .capture-bar {
        display: grid;
        grid-template-columns: 92px 98px 1fr 128px 104px auto;
        gap: 8px;
        padding: 10px;
        margin-bottom: 18px;
        border-radius: 12px;
        background: var(--surface);
        border: 1px solid var(--border);
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }
      .capture-bar input,
      .capture-bar select,
      textarea {
        padding: 8px 11px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--recessed);
        color: var(--fg);
        font: inherit;
        font-size: 12.5px;
        outline: none;
        transition: border-color 140ms ease, box-shadow 140ms ease;
      }
      .capture-bar input:focus,
      .capture-bar select:focus,
      textarea:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(124, 106, 247, 0.2);
      }
      .grid {
        display: grid;
        grid-template-columns: 1.55fr 1fr;
        gap: 16px;
        align-items: start;
      }
      @media (max-width: 720px) {
        body { padding: 14px; }
        .capture-bar { grid-template-columns: 1fr 1fr; }
        .grid { grid-template-columns: 1fr; }
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 14px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }
      .card h3 {
        margin: 0 0 12px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--muted);
      }
      .pills {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .segmented {
        display: inline-flex;
        gap: 3px;
        padding: 3px;
        border-radius: 9px;
        background: var(--recessed);
        border: 1px solid var(--border);
        margin-bottom: 12px;
        flex-wrap: wrap;
      }
      button {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px 12px;
        font: inherit;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        background: var(--surface-2);
        color: var(--fg);
        transition: background 140ms ease, border-color 140ms ease, transform 80ms ease;
      }
      button:hover:not(:disabled) {
        background: #252b3b;
        border-color: var(--border-strong);
      }
      button:active:not(:disabled) { transform: translateY(0.5px); }
      button:disabled { opacity: 0.5; cursor: default; }
      button.primary {
        background: var(--accent);
        border-color: rgba(255, 255, 255, 0.14);
        color: #ffffff;
        font-weight: 600;
        box-shadow: 0 2px 10px rgba(124, 106, 247, 0.32);
      }
      button.primary:hover:not(:disabled) { background: #8c7cf9; }
      button.ok {
        background: rgba(74, 222, 128, 0.14);
        border-color: rgba(74, 222, 128, 0.28);
        color: #6ee7a0;
        font-weight: 600;
      }
      button.ok:hover:not(:disabled) { background: rgba(74, 222, 128, 0.22); }
      .segmented button {
        border-color: transparent;
        background: transparent;
        color: var(--muted);
        padding: 4px 10px;
        border-radius: 6px;
      }
      .segmented button.active {
        background: var(--surface-2);
        border-color: var(--border-strong);
        color: #ffffff;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.28);
      }
      .item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 11px 13px;
        border-radius: 10px;
        background: var(--recessed);
        border: 1px solid var(--border);
        border-left: 3px solid var(--info);
        margin-bottom: 8px;
        transition: border-color 140ms ease, background 140ms ease;
      }
      .item:hover {
        background: #151924;
        border-color: var(--border-strong);
      }
      .item.urgent { border-left-color: var(--warn); }
      .item.done { opacity: 0.55; border-left-color: var(--ok); }
      .item-title { font-weight: 500; color: #f2f5fb; }
      .meta {
        font-size: 11.5px;
        color: var(--muted);
        margin-top: 2px;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
      }
      .badge {
        display: inline-block;
        padding: 1px 7px;
        border-radius: 999px;
        font-size: 10.5px;
        font-weight: 600;
        background: rgba(96, 165, 250, 0.13);
        border: 1px solid rgba(96, 165, 250, 0.24);
        color: var(--info);
        margin-left: 7px;
        vertical-align: middle;
      }
      .badge.blocked {
        background: rgba(251, 191, 36, 0.12);
        border-color: rgba(251, 191, 36, 0.28);
        color: var(--warn);
      }
      .conflict {
        padding: 9px 12px;
        border-radius: 8px;
        background: rgba(251, 191, 36, 0.1);
        border: 1px solid rgba(251, 191, 36, 0.24);
        color: var(--warn);
        font-size: 12px;
        margin-bottom: 10px;
      }
      .clock-display {
        font-size: 40px;
        font-weight: 300;
        letter-spacing: -0.03em;
        font-variant-numeric: tabular-nums;
        color: #ffffff;
        margin: 4px 0 10px;
      }
      .progress-track {
        height: 5px;
        border-radius: 999px;
        background: var(--recessed);
        overflow: hidden;
        margin-bottom: 12px;
      }
      .progress-fill {
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--accent), var(--info));
        transition: width 260ms ease;
      }
      .receipt {
        font-size: 11.5px;
        color: var(--ok);
        padding: 8px 11px;
        border-radius: 8px;
        background: rgba(74, 222, 128, 0.08);
        border: 1px solid rgba(74, 222, 128, 0.18);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
