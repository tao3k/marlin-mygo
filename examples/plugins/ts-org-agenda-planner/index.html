<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'none'"
    />
    <title>Marlin Org Agenda &amp; AI Daily Planner (React 19 + orgize DTOs)</title>
    <style>
      :root {
        --bg: var(--marlin-canvas, #282c34);
        --bar: var(--marlin-bar, #1c1f24);
        --fg: var(--marlin-ink, #bbc2cf);
        --accent: var(--marlin-accent, #c678dd);
        --info: var(--marlin-info, #51afef);
        --ok: var(--marlin-success, #98be65);
        --warn: var(--marlin-warning, #ecbe7b);
        --muted: var(--marlin-muted, #73797e);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 14px;
        font: 13px/1.5 system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 12px;
      }
      .subtitle { color: var(--muted); font-size: 12px; }
      .capture-bar {
        display: grid;
        grid-template-columns: 96px 96px 1fr 120px 104px auto;
        gap: 6px;
        margin-bottom: 12px;
      }
      .capture-bar input,
      .capture-bar select {
        padding: 7px 9px;
        border-radius: 6px;
        border: 1px solid var(--muted);
        background: var(--bar);
        color: var(--fg);
        font-size: 12px;
      }
      .grid {
        display: grid;
        grid-template-columns: 1.45fr 1fr;
        gap: 12px;
      }
      @media (max-width: 680px) {
        .capture-bar { grid-template-columns: 1fr 1fr; }
        .grid { grid-template-columns: 1fr; }
      }
      .card {
        background: var(--bar);
        border-radius: 10px;
        padding: 12px;
        margin-bottom: 12px;
      }
      .card h3 {
        margin: 0 0 8px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--info);
      }
      .pills {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }
      button {
        border: 0;
        border-radius: 6px;
        padding: 5px 10px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        background: var(--bg);
        color: var(--fg);
      }
      button:disabled { opacity: 0.55; cursor: default; }
      button.primary { background: var(--accent); color: #111; }
      button.ok { background: var(--ok); color: #111; }
      button.active { background: var(--info); color: #111; }
      .item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px;
        border-radius: 6px;
        background: var(--bg);
        border-left: 3px solid var(--info);
        margin-bottom: 6px;
      }
      .item.urgent { border-left-color: var(--warn); }
      .item.done { opacity: 0.6; border-left-color: var(--ok); }
      .meta { font-size: 11px; color: var(--muted); }
      .badge {
        display: inline-block;
        padding: 1px 6px;
        border-radius: 999px;
        font-size: 11px;
        background: rgba(81, 175, 239, 0.16);
        color: var(--info);
        margin-left: 6px;
      }
      .badge.blocked {
        background: rgba(236, 190, 123, 0.2);
        color: var(--warn);
      }
      .conflict {
        padding: 6px 8px;
        border-radius: 6px;
        background: rgba(236, 190, 123, 0.14);
        color: var(--warn);
        font-size: 12px;
        margin-bottom: 8px;
      }
      .clock-display {
        font-size: 28px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: var(--accent);
        margin: 4px 0 8px;
      }
      .receipt {
        font-size: 12px;
        color: var(--ok);
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
