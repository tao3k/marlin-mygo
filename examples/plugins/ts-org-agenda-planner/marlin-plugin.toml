# Complex Reference Use Case: Personal Org Agenda, Time-Block Schedule,
# Focus Alarm, and Structured Quick-Capture Workbench (TypeScript + bun build).
# Consumes canonical tao3k/orgize (and orgize-wasm) DTO projections with ZERO
# hand-rolled Org syntax parsing in JavaScript.
id = "tao3k.org-agenda-planner"
version = "0.1.0"
contract_major = 1
requires_features = ["ui-slot-v1", "scoped-panel-v1"]

[capabilities.read_agenda]
kind = "projection.read"
surface = "org.agenda"

[capabilities.read_clock]
kind = "projection.read"
surface = "org.clock"

[capabilities.read_session]
kind = "projection.read"
surface = "session.summary"

[contributions.agenda_panel]
kind = "ui-panel"
requires = ["read_agenda", "read_clock", "read_session"]

[contributions.agenda_panel.panel]
runtime = "webview-untrusted"
slot_id = "workbench.main"
cardinality = "single"
entry_path = "index.html"
read_scopes = ["org.agenda", "org.clock", "session.summary"]
declared_actions = [
  "org.capture.plan",
  "org.todo.toggle",
  "org.clock.in",
  "org.clock.out",
  "agenda.alarm.trigger",
]
activation = "on-command"
triggers = ["agenda.open", "planner.today"]
idle_unload_sec = 600
