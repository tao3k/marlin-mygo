# Reference Marketplace manifest: TypeScript Untrusted WebView plugin
id = "tao3k.org-kanban"
version = "0.2.0"
contract_major = 1
requires_features = ["workflow-preset", "ui-slot-v1", "scoped-panel-v1"]

[capabilities.read_org]
kind = "projection.read"
surface = "org.tasks"

[contributions.kanban_policy]
kind = "workflow-preset"
policy_module = "marlin.org.kanban"
settings_schema = "marlin.org.kanban.settings.v1"
requires = ["read_org"]

[contributions.kanban_panel]
kind = "ui-panel"
requires = ["read_org"]

[contributions.kanban_panel.panel]
runtime = "webview-untrusted"
slot_id = "workbench.main"
cardinality = "single"
entry_path = "index.html"
read_scopes = ["org.tasks", "session.summary"]
declared_actions = ["org.task.move-state"]
